<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>trace.pay · App prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF; --canvas:#F7F5FD; --ink:#120A2B; --ink-2:#2B2347; --muted:#6B6585; --faint:#A39DBB; --hair:#ECE8F5;
  --violet:#5B2EFF; --violet-d:#3A17C9; --violet-dd:#24108A; --violet-l:#8F6BFF; --violet-soft:#F1EDFF; --lime:#C6FF3D;
  --good:#0A9D5A; --good-bg:#E6F6EE; --warn:#E59A00; --warn-bg:#FFF4DC; --bad:#E03E2D; --bad-bg:#FDEAE7;
  --font:"Lexend",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:#ECE9F5;color:var(--ink);-webkit-font-smoothing:antialiased;font-weight:400}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--violet);outline-offset:3px;border-radius:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* type */
.d1{font-weight:600;font-size:34px;line-height:1.1;letter-spacing:-.03em}
.d2{font-weight:600;font-size:26px;line-height:1.15;letter-spacing:-.025em}
.d3{font-weight:600;font-size:20px;line-height:1.2;letter-spacing:-.02em}
.t1{font-weight:500;font-size:16px;line-height:1.35;letter-spacing:-.01em}
.t2{font-weight:500;font-size:14.5px;line-height:1.35}
.b1{font-weight:400;font-size:14.5px;line-height:1.55;color:var(--muted)}
.b2{font-weight:400;font-size:12.5px;line-height:1.45;color:var(--muted)}
.cap{font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

/* stage */
.stage{min-height:100%;display:flex;gap:48px;align-items:center;justify-content:center;padding:28px}
.phone{width:390px;height:844px;border-radius:56px;background:var(--white);box-shadow:0 0 0 11px #0E0822,0 0 0 12px #2b2448,0 50px 100px rgba(18,10,43,.25);position:relative;overflow:hidden;flex:none}
.notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#0E0822;z-index:95}
.guide{max-width:320px}
.guide img{height:40px;display:block;margin-bottom:22px}
.guide h1{font-weight:600;font-size:30px;letter-spacing:-.03em;line-height:1.12}
.guide p{color:var(--muted);margin:10px 0 20px;line-height:1.55;font-size:14.5px}
.guide ol{list-style:none;display:grid;gap:8px}
.guide button{width:100%;text-align:left;padding:12px 14px;background:#fff;border:1px solid var(--hair);border-radius:14px;display:flex;gap:12px;align-items:center;font-weight:500;transition:border-color .15s,transform .15s}
.guide button:hover{border-color:var(--violet-l);transform:translateX(2px)}
.guide button span{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.guide b{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet);font-weight:600;font-size:13px;flex:none}
@media (max-width:820px){ .stage{padding:0} .guide{display:none} .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none} .notch{display:none} }

/* surfaces */
.app{position:absolute;inset:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:64px 22px 118px;scrollbar-width:none;
  background:radial-gradient(120% 34% at 100% 0%,rgba(143,107,255,.13),transparent 70%),radial-gradient(80% 22% at 0% 0%,rgba(198,255,61,.10),transparent 70%),var(--white)}
.screen::-webkit-scrollbar{display:none}
.screen.full{padding-bottom:32px}
.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}}
.rise > *{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
.rise > *:nth-child(2){animation-delay:.05s}.rise > *:nth-child(3){animation-delay:.1s}.rise > *:nth-child(4){animation-delay:.15s}.rise > *:nth-child(5){animation-delay:.2s}.rise > *:nth-child(6){animation-delay:.25s}.rise > *:nth-child(7){animation-delay:.3s}.rise > *:nth-child(8){animation-delay:.35s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.card{background:var(--white);border:1px solid var(--hair);border-radius:20px}
.soft{background:var(--canvas);border-radius:20px}
.section{margin-top:30px}
.shead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.link{font-weight:500;font-size:13.5px;color:var(--violet)}

/* brand signature: logo corner squares */
.corners{position:relative}
.corners::before{content:"";position:absolute;inset:-5px;pointer-events:none;
  background:linear-gradient(var(--sq,#8F6BFF),var(--sq,#8F6BFF)) top left/10px 10px no-repeat,linear-gradient(var(--sq,#8F6BFF),var(--sq,#8F6BFF)) top right/10px 10px no-repeat,
             linear-gradient(var(--sq,#8F6BFF),var(--sq,#8F6BFF)) bottom left/10px 10px no-repeat,linear-gradient(var(--sq,#8F6BFF),var(--sq,#8F6BFF)) bottom right/10px 10px no-repeat;z-index:2}
.brandmark{display:block}

/* NeoPOP elevated buttons, CRED-style */
.np{--face:var(--ink);--er:var(--violet-d);--eb:var(--violet-dd);--fg:#fff;--d:4px;
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 24px;margin:0 var(--d) var(--d) 0;
  background:var(--face);color:var(--fg);font-weight:500;font-size:15.5px;letter-spacing:.01em;transition:transform .07s ease-out}
.np::before,.np::after{content:"";position:absolute;transition:all .07s ease-out}
.np::after{top:calc(var(--d) / 2);right:calc(-1 * var(--d));width:var(--d);height:100%;background:var(--er);transform:skewY(45deg);transform-origin:top left}
.np::before{left:calc(var(--d) / 2);bottom:calc(-1 * var(--d));height:var(--d);width:100%;background:var(--eb);transform:skewX(45deg);transform-origin:top left}
.np:active{transform:translate(var(--d),var(--d))}
.np:active::after{width:0;right:0}
.np:active::before{height:0;bottom:0}
.np.full{width:calc(100% - var(--d))}
.np.violet{--face:var(--violet)}
.np.white{--face:#fff;--er:#DCD6EA;--eb:#C6BDDD;--fg:var(--ink);box-shadow:inset 0 0 0 1px var(--hair)}
.np.danger{--face:var(--bad);--er:#B42A1B;--eb:#8A1D12}
.np.lime{--face:var(--lime);--er:#98CC1E;--eb:#739C10;--fg:var(--ink)}
.np[disabled]{--face:#EEEBF5;--er:#E2DDEE;--eb:#D5CEE6;--fg:#ABA5C2;pointer-events:none}
.np .arrow{font-size:18px;font-weight:300}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--white);border:1px solid var(--hair);display:grid;place-items:center;position:relative;flex:none}
.iconbtn .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:2px;background:var(--bad);border:2px solid #fff}

/* inputs */
.label{margin:0 0 8px 2px}
.field{display:flex;align-items:center;gap:12px;height:58px;padding:0 18px;background:var(--canvas);border:1.5px solid transparent;border-radius:16px;transition:all .15s}
.field:focus-within{background:#fff;border-color:var(--violet)}
.field input{flex:1;border:0;background:none;outline:none;font-weight:500;font-size:16px;min-width:0}
.field .pre{font-weight:500;color:var(--muted);padding-right:12px;border-right:1px solid var(--hair)}
.field svg{color:var(--faint)}
.switch{display:flex;padding:4px;border-radius:14px;background:var(--canvas);margin-bottom:18px}
.switch button{flex:1;height:44px;border-radius:11px;font-weight:500;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.switch button.on{background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(18,10,43,.08)}
.avatar{border-radius:30%;display:grid;place-items:center;font-weight:600;background:var(--violet-soft);color:var(--violet);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-weight:500;font-size:12px}

/* welcome */
.welcome{position:absolute;inset:0;padding:70px 24px 30px;display:flex;flex-direction:column;
  background:radial-gradient(90% 50% at 50% 26%,rgba(143,107,255,.20),transparent 70%),radial-gradient(50% 24% at 85% 60%,rgba(198,255,61,.14),transparent 70%),#fff}
.welcome .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.app-icon{width:132px;height:132px;position:relative;margin-bottom:34px;animation:bob 5s ease-in-out infinite}
.app-icon img{width:100%;height:100%;filter:drop-shadow(0 24px 30px rgba(91,46,255,.35))}
@keyframes bob{50%{transform:translateY(-8px)}}
.float-px{position:absolute;width:12px;height:12px;background:var(--violet-l);border-radius:2px;opacity:.6;animation:drift 7s ease-in-out infinite}
@keyframes drift{50%{transform:translate(8px,-14px) rotate(45deg)}}
.feat{display:grid;gap:12px;width:100%;margin-top:30px;text-align:left}
.feat div{display:flex;gap:14px;align-items:center}
.feat .fi{width:42px;height:42px;border-radius:13px;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center;flex:none}
.progress{display:flex;gap:6px;margin:20px 0 28px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--hair);overflow:hidden;position:relative}
.progress i.on::after{content:"";position:absolute;inset:0;background:var(--violet);animation:fill .5s ease-out}
@keyframes fill{from{transform:translateX(-100%)}}
.strength{display:flex;gap:6px;margin-top:12px}
.strength i{flex:1;height:5px;border-radius:3px;background:var(--hair);transition:background .25s}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.rules span{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--faint)}
.rules span svg{width:16px;height:16px}
.rules span.ok{color:var(--good)}
.cam{height:350px;border-radius:26px;background:radial-gradient(100% 80% at 50% 35%,#3c2a7a,#110828);position:relative;display:grid;place-items:center;overflow:hidden}
.oval{width:196px;height:256px;border-radius:50%;border:3px dashed rgba(255,255,255,.5);position:relative;transition:all .35s}
.oval.ok{border-style:solid;border-color:var(--lime);box-shadow:0 0 0 10px rgba(198,255,61,.14)}
.face{position:absolute;inset:36px 42px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#c99a7a,#8a6047 70%)}
.camtag{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font-weight:500;font-size:13px;white-space:nowrap;backdrop-filter:blur(10px);transition:all .3s}
.camtag.ok{background:var(--lime);color:var(--ink)}
.lockart{width:150px;height:150px;margin:10px auto 26px;border-radius:40px;background:linear-gradient(150deg,var(--violet),var(--violet-dd));display:grid;place-items:center;color:#fff;box-shadow:0 30px 50px -18px rgba(91,46,255,.55)}
.lockart svg{width:70px;height:70px;stroke-width:1.4}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.methods div{padding:14px 8px;text-align:center;border-radius:16px;background:var(--canvas);font-size:12.5px;color:var(--muted)}
.methods div svg{display:block;margin:0 auto 8px;color:var(--violet)}
.methods div.on{background:var(--violet-soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--violet)}

/* system biometric prompt (simulated OS sheet) */
.sysprompt{position:absolute;inset:0;z-index:90;background:rgba(10,6,24,.42);backdrop-filter:blur(6px);display:grid;place-items:center;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.sysprompt .box{width:250px;border-radius:26px;background:rgba(255,255,255,.96);padding:26px 20px 18px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);animation:sys .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes sys{from{transform:scale(.85);opacity:0}}
.sysprompt .fid{width:70px;height:70px;margin:0 auto 14px;color:var(--violet);position:relative}
.sysprompt .fid svg{width:70px;height:70px;stroke-width:1.4}
.sysprompt .fid.scanning svg{animation:pulse 1s ease-in-out infinite}
.sysprompt .fid.ok svg{color:var(--good)}
@keyframes pulse{50%{transform:scale(.9);opacity:.6}}
.sysprompt .alt{margin-top:16px;padding-top:12px;border-top:1px solid var(--hair);color:var(--violet);font-weight:500;font-size:14px;width:100%}

/* home */
.topbar{display:flex;align-items:center;gap:10px}
.topbar img{height:30px;margin-right:auto}
.hello{margin-top:26px}
.hero-card{margin-top:20px;border-radius:28px;padding:22px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,#8F6BFF 0%,transparent 55%),linear-gradient(150deg,#5B2EFF 0%,#3A17C9 55%,#24108A 100%);box-shadow:0 34px 60px -26px rgba(58,23,201,.75)}
.hero-card .px{position:absolute;right:-6px;top:6px;width:170px;height:170px;opacity:.13}
.hero-card .bal{font-weight:600;font-size:42px;letter-spacing:-.03em;margin:4px 0 4px}
.hero-card .vpa{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.12);font-size:13px;font-weight:400}
.hero-card .ha{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.hero-card .ha button{height:50px;border-radius:15px;font-weight:500;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.hero-card .ha .lime{background:var(--lime);color:var(--ink)}
.hero-card .ha .glass{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.18)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:24px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.qa .q{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;background:var(--canvas);color:var(--violet);transition:transform .15s,background .15s}
.qa button:active .q{transform:scale(.93);background:var(--violet-soft)}
.qa .q.sos{color:var(--bad);background:var(--bad-bg)}
.safety{display:flex;gap:16px;align-items:center;padding:18px}
.ringmini{width:66px;height:66px;position:relative;flex:none}
.ringmini > svg{width:66px;height:66px;transform:rotate(-90deg)}
.ringmini b{position:absolute;inset:0;display:grid;place-items:center;color:var(--good)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;padding-top:14px;border-top:1px solid var(--hair)}
.stats div{text-align:center}
.stats b{display:block;font-weight:600;font-size:19px;letter-spacing:-.02em}
.banner{display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;background:var(--bad-bg);width:100%;text-align:left}
.banner .bi{width:42px;height:42px;border-radius:13px;background:#fff;color:var(--bad);display:grid;place-items:center;flex:none}
.tx{display:flex;align-items:center;gap:14px;padding:14px 4px;width:100%;text-align:left}
.tx + .tx{border-top:1px solid var(--hair)}
.tx .who{flex:1;min-width:0}
.tx .who b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{text-align:right;font-weight:500;font-size:15px}
.learn{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:0 22px 4px}
.lc{flex:none;width:240px;padding:20px;border-radius:24px;position:relative;overflow:hidden}
.lc .li{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;margin-bottom:28px}

/* tab bar */
.tabbar{position:absolute;left:16px;right:16px;bottom:20px;height:70px;padding:0 6px;display:flex;align-items:center;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--hair);border-radius:24px;box-shadow:0 20px 40px -16px rgba(18,10,43,.22);z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:500;color:var(--faint)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--violet)}
.tab.scanbtn .bubble{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:var(--violet);color:#fff;margin-top:-34px;box-shadow:0 14px 26px -8px rgba(91,46,255,.6)}

/* scan */
.scan{position:absolute;inset:0;background:#0B061D;color:#fff;z-index:30;overflow:hidden}
.scan .feed{position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 36%,rgba(123,87,255,.32),transparent 70%)}
.scan .top{position:absolute;top:62px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.scan .round{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.12);display:grid;place-items:center;backdrop-filter:blur(10px)}
.scan .round.on{background:var(--lime);color:var(--ink)}
.scan .frame{position:absolute;left:50%;top:36%;width:236px;height:236px;transform:translate(-50%,-50%);border-radius:36px;transition:all .45s cubic-bezier(.2,1.3,.4,1);
  box-shadow:0 0 0 2000px rgba(11,6,29,.35),inset 0 0 0 2px rgba(255,255,255,.35)}
.scan .frame::before{inset:-7px;--sq:#C6FF3D}
.scan .frame::before{background-size:16px 16px!important}
.scan .beam{position:absolute;left:22px;right:22px;height:50px;background:linear-gradient(180deg,transparent,rgba(198,255,61,.22));border-bottom:2px solid var(--lime);animation:beam 1.9s ease-in-out infinite alternate}
@keyframes beam{from{top:10px}to{top:174px}}
.scan .code{position:absolute;inset:50px;opacity:0;transform:scale(.6);transition:all .4s cubic-bezier(.2,1.3,.4,1)}
.scan.locked .frame{width:196px;height:196px;box-shadow:0 0 0 2000px rgba(11,6,29,.6),inset 0 0 0 2px var(--lime)}
.scan.locked .beam{display:none}
.scan.locked .code{opacity:1;transform:none}
.scan .found,.scan .hint{position:absolute;top:calc(36% + 140px);left:0;right:0;text-align:center;transition:all .25s}
.scan .found{opacity:0;transform:translateY(8px)}
.scan .found span{display:inline-flex;gap:8px;align-items:center;padding:10px 18px;border-radius:99px;background:var(--lime);color:var(--ink);font-weight:500;font-size:14px}
.scan.locked .found{opacity:1;transform:none}
.scan.locked .hint{opacity:0}
.scan .zoom{position:absolute;top:calc(36% + 186px);left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:99px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px)}
.scan .zoom button{width:42px;height:32px;border-radius:99px;font-size:12.5px;color:rgba(255,255,255,.8)}
.scan .zoom button.on{background:#fff;color:var(--ink)}
.scan .tray{position:absolute;left:0;right:0;bottom:0;background:#fff;color:var(--ink);border-radius:30px 30px 0 0;padding:14px 20px 30px;z-index:2}
.scan .tray .grab{width:40px;height:5px;border-radius:5px;background:var(--hair);margin:0 auto 16px}
.demo{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.demo button{flex:none;display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:16px;background:var(--canvas);text-align:left}
.applogo{display:grid;place-items:center;color:#fff;font-weight:600;flex:none}

/* ScoreMeter */
.meter{position:relative;width:236px;height:236px;margin:6px auto 0}
.meter svg{position:absolute;inset:0;width:236px;height:236px;overflow:visible}
.meter .box{position:absolute;inset:44px;border-radius:50%;background:#fff;box-shadow:0 0 0 8px var(--canvas),0 18px 34px -14px rgba(18,10,43,.22);display:flex;flex-direction:column;align-items:center;justify-content:center}
.meter .reading{font-weight:600;font-size:54px;line-height:1;letter-spacing:-.04em;margin-top:2px}
.meter .reading small{font-size:20px;font-weight:500;margin-left:2px}
.meter .delta{margin-top:7px;font-size:11.5px;font-weight:500;opacity:0;transition:opacity .3s}
.meter.done .delta{opacity:1}
.legends{display:flex;justify-content:space-between;width:212px;margin:0 auto;font-size:11.5px;color:var(--faint)}
.verdict{display:flex;gap:12px;padding:16px;margin-top:20px;border-radius:18px;align-items:flex-start}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fact{display:flex;gap:11px;align-items:center;padding:14px;border-radius:16px;background:var(--canvas)}
.fact .fi{width:36px;height:36px;border-radius:11px;background:#fff;color:var(--violet);display:grid;place-items:center;flex:none}
.group{margin-top:22px}
.group h4{margin:0 0 10px 2px}
.factor{display:flex;gap:14px;padding:15px 16px;align-items:flex-start;opacity:0;transform:translateY(8px);transition:all .4s cubic-bezier(.2,.9,.2,1)}
.factor.in{opacity:1;transform:none}
.factor + .factor{border-top:1px solid var(--hair)}
.factor .fic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.factor .fb{flex:1;min-width:0}
.factor .fb p{font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:3px}
.impact{display:flex;gap:3px;margin-top:8px;align-items:center;font-size:10.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.impact i{width:14px;height:4px;border-radius:1px;background:var(--hair)}
.factor .pts{font-weight:600;font-size:15px;flex:none}
.note{display:flex;gap:12px;padding:14px 16px;font-size:14px;line-height:1.45;align-items:flex-start;color:var(--ink-2)}
.note + .note{border-top:1px solid var(--hair)}

/* overlays */
.scrim{position:absolute;inset:0;background:rgba(10,6,24,.36);z-index:40;opacity:0;transition:opacity .25s;backdrop-filter:blur(3px)}
.scrim.on{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:93%;background:#fff;border-radius:32px 32px 0 0;z-index:41;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,1,.3,1);display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--hair);margin:10px auto 0;flex:none}
.sheet .body{overflow-y:auto;padding:18px 22px;scrollbar-width:none}
.sheet .actions{padding:14px 22px 30px;border-top:1px solid var(--hair);display:grid;gap:12px;flex:none}
.sheet .actions .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:absolute;left:22px;right:22px;bottom:108px;padding:15px 18px;border-radius:18px;background:var(--ink);color:#fff;font-size:14px;display:flex;gap:10px;align-items:center;z-index:80;transform:translateY(20px);opacity:0;transition:all .3s;pointer-events:none;box-shadow:0 20px 40px -14px rgba(18,10,43,.55)}
.toast svg{color:var(--lime)}
.toast.on{transform:none;opacity:1}
.dialog{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-46%) scale(.96);opacity:0;background:#fff;border-radius:28px;padding:26px;z-index:82;transition:all .25s cubic-bezier(.2,1.2,.4,1);pointer-events:none;box-shadow:0 40px 80px -24px rgba(18,10,43,.4)}
.dialog.on{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto}
.handoff{position:absolute;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:30px;color:#fff}
.handoff .logo{width:90px;height:90px;border-radius:28px;display:grid;place-items:center;font-weight:600;font-size:38px;margin:0 auto 22px;background:#fff;box-shadow:0 24px 44px -14px rgba(0,0,0,.4)}
.dots{display:flex;gap:7px;justify-content:center;margin:18px 0}
.dots i{width:8px;height:8px;border-radius:2px;background:#fff;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.3;transform:translateY(-4px)}}
.amount{font-weight:600;font-size:64px;line-height:1;letter-spacing:-.04em;text-align:center;margin:20px 0 10px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:18px 0 16px}
.keypad button{height:60px;border-radius:18px;font-weight:400;font-size:26px;transition:background .1s}
.keypad button:active{background:var(--violet-soft)}
.approw{display:flex;align-items:center;gap:14px;padding:15px 16px;width:100%;text-align:left}
.approw + .approw{border-top:1px solid var(--hair)}
.bigring{width:200px;height:200px;margin:34px auto 24px;position:relative}
.bigring svg{width:200px;height:200px;transform:rotate(-90deg)}
.bigring b{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:46px;letter-spacing:-.03em}
.toggle{width:52px;height:32px;border-radius:32px;background:var(--hair);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(18,10,43,.2);transition:transform .22s cubic-bezier(.2,1.3,.4,1)}
.toggle.on{background:var(--violet)}
.toggle.on::after{transform:translateX(20px)}
.setting{display:flex;align-items:center;gap:14px;padding:15px 16px;width:100%;text-align:left}
.setting + .setting{border-top:1px solid var(--hair)}
.setting .si{width:40px;height:40px;border-radius:12px;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center;flex:none}
.setting > div{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chips button{padding:10px 15px;border-radius:13px;background:var(--canvas);font-size:13.5px;font-weight:500;display:inline-flex;gap:7px;align-items:center}
.chips button.on{background:var(--ink);color:#fff}
.bars{display:flex;align-items:flex-end;gap:12px;height:130px;margin-top:20px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bars i{width:100%;border-radius:8px;background:var(--violet-soft);transition:height .8s cubic-bezier(.2,.9,.2,1)}
.bars div.today i{background:var(--violet)}
.qrbox{width:236px;height:236px;margin:20px auto;padding:18px;background:#fff;border-radius:28px;box-shadow:0 24px 44px -20px rgba(18,10,43,.25);position:relative}
.qrbox .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:50px;height:50px;background:#fff;border-radius:12px;padding:3px}
.timeline{position:relative;padding-left:28px}
.timeline::before{content:"";position:absolute;left:9px;top:10px;bottom:10px;width:2px;background:var(--hair)}
.tl{position:relative;padding:9px 0}
.tl::before{content:"";position:absolute;left:-23px;top:13px;width:12px;height:12px;border-radius:3px;background:var(--good);box-shadow:0 0 0 4px var(--good-bg)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;font-size:14px}
.kv + .kv{border-top:1px solid var(--hair)}
.kv span{color:var(--muted)}
.burst{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.burst i{position:absolute;left:50%;top:30%;width:9px;height:9px;border-radius:2px;animation:burst 1.2s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(300deg);opacity:0}}
.okmark{width:116px;height:116px;margin:0 auto;border-radius:36px;background:linear-gradient(150deg,#14B86C,#0A9D5A);display:grid;place-items:center;color:#fff;box-shadow:0 30px 50px -18px rgba(10,157,90,.6);animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
.okmark svg{width:56px;height:56px;stroke-width:2.4;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .3s forwards}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
</style>
</head>

const app = $('#app');
let tab = 'home';
function render(html, {tabs = true, full = false, rise = true} = {}) {
  app.innerHTML = `<div class="screen enter ${full ? 'full' : ''}"><div class="${rise ? 'rise' : ''}">${html}</div></div>${tabs ? tabbar() : ''}<div class="toast" id="toast"></div>`;
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
}
function tabbar() {
  const t = (id, icon, label) => `<button class="tab ${tab === id ? 'on' : ''}" data-go="${id}">${ic(icon)}${label}</button>`;
  return `<nav class="tabbar">${t('home', 'home', 'Home')}${t('activity', 'list', 'Activity')}
    <button class="tab scanbtn" data-go="scan" aria-label="Scan"><span class="bubble">${ic('scan')}</span><span style="margin-top:5px">Scan</span></button>
    ${t('check', 'shield', 'Check')}${t('profile', 'user', 'Profile')}</nav>`;
}
function toast(msg, icon = 'checkc') { const t = $('#toast'); if (!t) return; t.innerHTML = ic(icon) + msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2400); }
function go(where, arg) { if (['home', 'activity', 'check', 'profile'].includes(where)) tab = where; (SCREENS[where] || SCREENS.home)(arg); }
function avatar(name, size = 46) { const s = name.split(/[ .@]/).filter(Boolean).slice(0, 2).map(x => x[0].toUpperCase()).join(''); return `<span class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size / 2.9)}px">${s}</span>`; }
function btn(label, {kind = '', id = '', go: g = '', arrow = false, full = true, attrs = ''} = {}) {

// ---------- ScoreMeter ----------
const R = 96, C = 2 * Math.PI * R, ARC = .75;
function scoreMeter(a) {
  const type = TYPE(a.score), color = TC[type], diff = a.score - a.old;
  const ticks = Array.from({length: 31}, (_, i) => { const ang = (135 + i * 9) * Math.PI / 180, r1 = 116, r2 = i % 5 ? 112 : 108;
    return `<line x1="${118 + r1 * Math.cos(ang)}" y1="${118 + r1 * Math.sin(ang)}" x2="${118 + r2 * Math.cos(ang)}" y2="${118 + r2 * Math.sin(ang)}" stroke="var(--faint)" stroke-opacity="${i % 5 ? .45 : .9}" stroke-width="${i % 5 ? 1 : 1.6}" stroke-linecap="round"/>`; }).join('');
  return `<div class="meter">
      <svg viewBox="0 0 236 236" aria-hidden="true">${ticks}
        <circle cx="118" cy="118" r="${R}" fill="none" stroke="var(--canvas)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C * ARC} ${C}" transform="rotate(135 118 118)"/>
        <circle cx="118" cy="118" r="${R}" fill="none" stroke="${color}" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 ${C}" transform="rotate(135 118 118)" class="arc"/>
        <g class="dot" style="transform-origin:118px 118px"><rect x="${118 + R - 11}" y="107" width="22" height="22" rx="6" fill="#fff" style="filter:drop-shadow(0 4px 8px rgba(18,10,43,.25))"/><rect x="${118 + R - 5}" y="113" width="10" height="10" rx="2" fill="${color}"/></g>
      </svg>
      <div class="box"><span class="cap">Risk score</span><div class="reading num"><span class="count">0</span><small>%</small></div>
        <span class="pill" style="background:${TBG[type]};color:${color};margin-top:6px">${TL[type]}</span>
        <span class="delta" style="color:${diff > 0 ? 'var(--bad)' : diff < 0 ? 'var(--good)' : 'var(--faint)'}">${diff ? `${diff > 0 ? '▲' : '▼'} ${Math.abs(diff)} since last check` : 'No change'}</span></div>
    </div><div class="legends"><span>0</span><span>100</span></div>`;
}
function animateMeter(root, a) {
  const arc = root.querySelector('.arc'), dot = root.querySelector('.dot'), count = root.querySelector('.count'), meter = root.querySelector('.meter');
  const set = v => { arc.setAttribute('stroke-dasharray', `${C * ARC * v / 100} ${C}`); dot.style.transform = `rotate(${135 + 270 * v / 100}deg)`; count.textContent = Math.round(v); };
  const from = a.old === a.score ? 0 : a.old, to = a.score, t0 = performance.now(), dur = 1400; set(from);
  (function tick(t) { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); set(from + (to - from) * e); if (p < 1) requestAnimationFrame(tick); else meter.classList.add('done'); })(t0);
}

      <h2 class="d1" style="margin-top:18px">Act within the first hour</h2><p class="b1" style="margin-top:8px">Money reported quickly is the easiest to freeze.</p>
      <div class="card" style="margin-top:22px">${[['phone', 'Call 1930', 'National cyber-crime helpline. Share the amount, time and UPI ID.', 's1'], ['doc', 'File a complaint', 'At cybercrime.gov.in. Keep screenshots of the chat and payment.', 's2'], ['bank', 'Call your bank', 'Ask them to block the transaction and raise a dispute.', 's3']].map(([i, t, d, id]) =>
        `<button class="setting" id="${id}" style="align-items:flex-start"><span class="si" style="background:var(--bad-bg);color:var(--bad)">${ic(i, 'width:20px;height:20px')}</span><div><b class="t1">${t}</b><p class="b2" style="margin-top:3px">${d}</p></div>${ic('chev', 'color:var(--faint)')}</button>`).join('')}</div>
      <div class="soft" style="margin-top:16px;padding:20px"><b class="t1">Warn others</b><p class="b2" style="margin-top:3px">Report the account so everyone gets a warning.</p>
        <label class="field" style="margin:14px 0 16px;background:#fff">${ic('link')}<input id="scammer" placeholder="Scammer's UPI ID" autocapitalize="none" aria-label="Scammer's UPI ID"></label>
        ${btn(ic('flag', 'width:17px;height:17px') + 'Report on trace.pay', {kind: 'danger', id: 'rep'})}</div>`, {tabs: false});
    $('#rep').onclick = () => reportScam($('#scammer').value || 'quickearn.collect@ybl');
    $('#s1').onclick = () => toast('Opens the phone dialler: 1930', 'phone');
    $('#s2').onclick = () => toast('Opens cybercrime.gov.in', 'doc');
  },
};

function handoff(a, q, amt) {
  if (!a.installed) return dialog(`${a.name} isn't installed`, `We copied ${q.vpa}. Pay in any UPI app, or install ${a.name}.`, [{label: `Get ${a.name}`}, {label: 'OK', kind: 'white'}]);
  app.insertAdjacentHTML('beforeend', `<div class="handoff enter" id="ho" style="background:linear-gradient(160deg,${a.color},#0B061D 140%)">
    <div><div class="logo" style="color:${a.color}">${a.name[0]}</div><h3 class="d2">Opening ${a.name}</h3>
    <div class="dots"><i></i><i></i><i></i></div><p class="b1" style="color:rgba(255,255,255,.85);max-width:270px;margin:0 auto 30px">Enter your UPI PIN in ${a.name} to pay ${fmt(amt)} to ${q.label}.</p>
    ${btn('Return to trace.pay', {kind: 'white', id: 'back', full: false})}</div></div>`);
  $('#back').onclick = () => { $('#ho').remove();
    dialog('Did the payment go through?', `${a.name} doesn't report back on iPhone, so confirm to save it.`, [
      {label: 'Yes, I paid', run: () => { state.activity.unshift({id: Date.now(), who: q.label, vpa: q.vpa, via: a.name, amt: Number(amt), in: false, when: 'Just now', type: TYPE(ACCOUNTS[q.vpa].score)}); success(q.label, amt, a.name); }},
      {label: 'No', kind: 'white'}]); };
}
function cooling(a, amt, vpa) {
  let left = 10;
  render(`<div style="text-align:center;padding-top:60px"><span class="cap">Cooling-off</span><div class="bigring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" stroke="var(--canvas)" stroke-width="10" fill="none"/>
      <circle cx="100" cy="100" r="88" stroke="var(--violet)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="0" id="rc" style="transition:stroke-dashoffset 1s linear"/></svg><b id="rt" class="num">0:10</b></div>
      <h2 class="d2">Take a moment</h2><p class="b1" style="max-width:300px;margin:8px auto 28px">This is your first payment of ${fmt(amt)} to ${a.name}. Scammers rush you. Do you know this person?</p>
      ${btn('Cancel payment', {kind: 'white', go: 'home'})}<p class="b2" style="margin-top:14px">The real app waits 1, 5 or 10 minutes.</p></div>`, {tabs: false, full: true, rise: false});
  const t = setInterval(() => { left--; const rt = $('#rt'); if (!rt) return clearInterval(t); rt.textContent = '0:' + String(left).padStart(2, '0'); $('#rc').style.strokeDashoffset = 553 * (1 - left / 10);
    if (left <= 0) { clearInterval(t); confirmPay(a, amt, vpa); } }, 1000);
}
function confirmPay(a, amt, vpa) {
  deviceAuth(`Pay ${fmt(amt)} to ${a.name}`, () => { state.balance -= Number(amt); state.activity.unshift({id: Date.now(), who: a.name, vpa, via: 'Trace.Pay', amt: Number(amt), in: false, when: 'Just now', type: TYPE(a.score)}); success(a.name, amt, 'Trace.Pay'); });
}
function success(who, amt, via) {
  render(`<div style="text-align:center;padding-top:104px"><div class="okmark corners" style="--sq:var(--lime)">${ic('check')}</div>
      <p class="b1" style="margin-top:38px">Paid to ${who}</p><div class="num" style="font-weight:600;font-size:54px;letter-spacing:-.04em;margin-top:6px">${fmt(amt)}</div>
      <p class="b2" style="margin-top:8px">via ${via} · checked by trace.pay</p>
      <span class="pill num" style="background:var(--canvas);color:var(--muted);margin-top:16px">Ref 4312 ${Math.floor(1000 + Math.random() * 9000)} ${Math.floor(1000 + Math.random() * 9000)}</span></div>
    <div style="position:absolute;left:22px;right:22px;bottom:34px" class="stack">${btn(ic('share', 'width:18px;height:18px') + 'Share receipt', {kind: 'white'})}${btn('Done', {go: 'home'})}</div>`, {tabs: false, full: true, rise: false});
  burst();
}
function qrCells() {
  let cells = '', seed = 11;
  for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) { seed = (seed * 9301 + 49297) % 233280;
    const inF = (fx, fy) => x >= fx && x < fx + 7 && y >= fy && y < fy + 7;
    const fin = (fx, fy) => { const dx = x - fx, dy = y - fy; return dx === 0 || dy === 0 || dx === 6 || dy === 6 || (dx > 1 && dx < 5 && dy > 1 && dy < 5); };
    const mid = x > 9 && x < 15 && y > 9 && y < 15;
    let on; if (inF(0, 0)) on = fin(0, 0); else if (inF(18, 0)) on = fin(18, 0); else if (inF(0, 18)) on = fin(0, 18); else on = !mid && seed / 233280 > .52;
    if (on) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`; }
  return cells;
}
function myQR() {
  sheet(`<div style="text-align:center"><span class="cap">My QR</span><h3 class="d2" style="margin-top:8px">Scan to pay me</h3><p class="b2">Works with any UPI app</p></div>
    <div class="qrbox corners"><svg viewBox="0 0 25 25" fill="var(--ink)" shape-rendering="crispEdges">${qrCells()}</svg><img class="center" src="${MARK}" alt=""></div>
    <p class="t1" style="text-align:center">Kunal Kumar Dappu</p><p class="b2" style="text-align:center">kunal@tracepay</p>`,
    `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${btn(ic('copy', 'width:17px;height:17px') + 'Copy ID', {kind: 'white'})}${btn(ic('share', 'width:17px;height:17px') + 'Share')}</div>`);
}

document.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => {
  app.querySelectorAll('.scan,.handoff,.sysprompt,.scrim,.sheet,.dialog,.burst').forEach(el => el.remove());
  const j = b.dataset.jump;
  if (j === 'risky') { tab = 'home'; go('home'); setTimeout(() => openReport('quickearn.collect@ybl'), 250); }
  else if (j === 'external') SCREENS.external(QRS[0]);
  else if (j === 'paymember') SCREENS.paymember('arjun.k@tracepay');
  else if (j === 'txn') { tab = 'activity'; SCREENS.txn(2); }
  else go(j);
});
SCREENS.welcome();
</script>
</body>
</html>
