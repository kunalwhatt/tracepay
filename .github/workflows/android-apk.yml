name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write   # publish the APK as a GitHub Release so installed apps can update themselves
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Signing key and version
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tracepay.jks"
            echo "TP_KEYSTORE=$RUNNER_TEMP/tracepay.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is missing: this APK can't update an installed app."
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "TP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
          echo "TP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android-app
        env:
          TP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk tracepay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tracepay-android-apk
          path: tracepay.apk
      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tracepay.apk
          name: trace.pay ${{ github.ref_name }}
          generate_release_notes: true
